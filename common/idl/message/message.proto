syntax = "proto3";

option go_package = "github.com/hardcore-os/plato/common/idl/message";

package message;
// 在项目根目录下执行 protoc --go-grpc_out=. --go_out=. ./common/idl/message/message.proto
enum CmdType { //枚举消息类型
    Login = 0;
    Heartbeat = 1;
    ReConn = 2;
    ACK = 3;
    UP = 4; // 上行消息
    Push = 5; // 下行 推送消息
    ReadReceipt = 6; // 已读回执：客户端上行，告知服务端"我在某会话已读到某个seq"，不回ACK(即发即弃，语义上允许丢失，下次打开会话会重报)
}


// 顶层cmd pb结构
// 我们的协议结构就是：dataLen+MsgCmd的结构
// 根据不同的Type选择不同的解码器
message MsgCmd{
   CmdType Type = 1;
   bytes Payload = 2;
}

// 上行消息 pb结构
message UPMsg{
    UPMsgHead Head = 1;
    bytes UPMsgBody = 2;
 }
 
 // 上行消息头 pb结构
message UPMsgHead{
    uint64 ClientID = 1;
    uint64 ConnID = 2;
    string SessionId = 3;
    // ToDid 旧版单聊目标did；新版客户端使用ToUserID，群聊时填0
    uint64 ToDid = 4;
    // GroupID 群聊目标群id；单聊时填0
    uint64 GroupID = 5;
    // ClientMsgID 客户端生成的全局唯一ID(建议用UUID)，用于跨连接的消息去重——
    // 区别于ClientID(仅同一物理连接内严格递增，重连后会被重置)，ClientMsgID在客户端
    // 本地生成后不会因为断线重连而改变，是"这条消息"的唯一身份标识
    string ClientMsgID = 6;
    // ToUserID 单聊目标账号的用户ID；新客户端必须使用该字段，ToDid仅保留协议兼容
    uint64 ToUserID = 7;
 }

 message PushMsg{
     uint64 MsgID   = 1;
     uint64 SessionID = 2;
     bytes  Content = 3;
 }
// ACK 消息
message ACKMsg {
    uint32 Code = 1;
    string Msg = 2;
    CmdType Type = 3;
    uint64 ConnID = 4;
    uint64 ClientID = 5;
    uint64 SessionID = 6;
    uint64 MsgID = 7;
    // DeviceID 仅在Login/ReConn类型的ACK里携带，供gateway回填connID<->did的双向映射，
    // 用于后续该连接的上行消息按did做一致性哈希分片路由
    uint64 DeviceID = 8;
    // ClientMsgID 仅在UP类型的ACK里携带，回传客户端发这条消息时用的ClientMsgID，
    // 供客户端匹配到本地"待确认发送队列"里的具体消息，从而做失败重试/成功确认
    string ClientMsgID = 9;
    // UserID 登录成功后返回的账号用户ID
    uint64 UserID = 10;
}

// 登陆消息
message LoginMsgHead {
     uint64 DeviceID = 1;
     // UserID 由账号密码登录接口确定，不能由客户端自行冒充
     uint64 UserID = 2;
     // SessionToken 由user服务签发，并绑定UserID与DeviceID
     string SessionToken = 3;
}

message LoginMsg {
   LoginMsgHead Head = 1;//状态server解析
   bytes LoginMsgBody = 2;//业务server解析
}

// 心跳消息
message HeartbeatMsgHead {
}

message HeartbeatMsg {
  HeartbeatMsgHead Head = 1;
  bytes HeartbeatMsgBody = 2;
}

// 重连消息
message ReConnMsgHead {
    uint64 ConnID = 1;
}

message ReConnMsg {
    ReConnMsgHead Head = 1;
    bytes ReConnMsgBody = 2;
}

// 已读回执：客户端在"打开某个会话"或"退出会话时该会话有新消息"时上报，
// 表示"这个会话我已经看到seq<=ReadSeq的所有消息了"。state收到后直接写入
// Redis(read_seq_{did})，不经过Kafka——这是轻量的单机状态更新，不需要可靠队列。
message ReadReceiptMsg {
    string ConversationID = 1;
    uint64 ReadSeq = 2;
}
