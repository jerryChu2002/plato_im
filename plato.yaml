global:
  env: debug
auth:
  session_secret: "plato-local-development-secret-change-in-production"
  session_ttl: 168h
discovery:
  endpoints:
    - localhost:2379
  timeout: 5
cache:
  redis:
    endpoints:
    - 127.0.0.1:6379
ip_conf:
  service_path: /plato/ip_dispatcher
prpc:
  discov:
    name: etcd
    endpoints:
      - localhost:2379
  trace:
    enable: true
    url: http://127.0.0.1:14268/api/traces
    service_name: plato
    sampler: 1.0
gateway:
  service_name: "plato.access.gateway"
  service_addr: "127.0.0.1"
  tcp_max_num: 70000
  epoll_channel_num: 100
  epoll_num: 4
  epoll_wait_queue_size: 100
  tcp_server_port: 8900
  rpc_server_port: 8901
  worker_pool_num: 1024
  cmd_channel_num: 2048
  weight: 100
  state_server_endpoint: "127.0.0.1:8902"
state: 
  service_name: "plato.access.state"
  service_addr: "127.0.0.1"
  cmd_channel_num: 2048
  server_port: 8902
  weight: 100
  conn_state_slot_range: "0,1024"
  gateway_server_endpoint: "127.0.0.1:8901"
user_domain:
  service_name: "plato.domain.user"
  service_addr: "127.0.0.1"
  service_port: 8903
  weight: 100
  db_dns: "user:password@tcp(127.0.0.1:3306)/database?charset=utf8mb4&parseTime=True&loc=Local"
kafka:
  brokers:
    - 127.0.0.1:9092
  chat_topic: plato_chat_msg
  consumer_group: plato_message_consumer
message_domain:
  service_name: "plato.domain.message"
  service_addr: "127.0.0.1"
  service_port: 8904
  weight: 100
  db_dns: "user:password@tcp(127.0.0.1:3306)/database?charset=utf8mb4&parseTime=True&loc=Local"
friend_domain:
  service_name: "plato.domain.friend"
  service_addr: "127.0.0.1"
  service_port: 8905
  weight: 100
  db_dns: "user:password@tcp(127.0.0.1:3306)/database?charset=utf8mb4&parseTime=True&loc=Local"
group_domain:
  service_name: "plato.domain.group"
  service_addr: "127.0.0.1"
  service_port: 8906
  weight: 100
  db_dns: "user:password@tcp(127.0.0.1:3306)/database?charset=utf8mb4&parseTime=True&loc=Local"
